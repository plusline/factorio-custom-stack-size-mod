[mod-setting-description]
stackmod-enable-coal=When enabled, this mod will change the stack size for coal according to `data.lua`.
stackmod-enable-stone=When enabled, this mod will change the stack size for stone according to `data.lua`.
stackmod-enable-wood=When enabled, this mod will change the stack size for wood according to `data.lua`.
stackmod-enable-promethium-asteroid-chunk=When enabled, this mod will change the stack size for Promethium Asteroid Chunk according to `data.lua`.
stackmod-stacksize-coal=Set the stack size for coal (integer value).
stackmod-stacksize-stone=Set the stack size for stone (integer value).
stackmod-stacksize-wood=Set the stack size for wood (integer value).
stackmod-stacksize-promethium-asteroid-chunk=Set the stack size for Promethium Asteroid Chunk (integer value).
