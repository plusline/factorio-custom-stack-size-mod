stackmod-enable-coal=Enable stack modification for coal
stackmod-enable-stone=Enable stack modification for stone
stackmod-enable-wood=Enable stack modification for wood
stackmod-enable-promethium-asteroid-chunk=Enable stack modification for Promethium Asteroid Chunk
stackmod-stacksize-coal=Coal stack size
